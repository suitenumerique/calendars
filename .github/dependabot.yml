version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/src/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/src/e2e"
    schedule:
      interval: "weekly"

  # Note: sabre/dav is pinned to a dev-master commit and cannot be
  # updated by Dependabot — bump it manually (see composer.json).
  - package-ecosystem: "composer"
    directory: "/src/caldav"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/src/backend"
      - "/src/frontend"
      - "/src/caldav"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
